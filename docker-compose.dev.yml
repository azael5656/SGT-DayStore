services:
  # Exponer puertos de BD al host para desarrollo local
  # Puertos host cambiados (55432 / 27018) para no chocar con PostgreSQL y
  # MongoDB instalados localmente en la PC (que ya ocupan 5432, 5433 y 27017).
  # Dentro de Docker siguen siendo 5432 / 27017 (servicios y visores intactos).
  postgres:
    ports:
      - "55432:5432"

  mongo:
    ports:
      - "27018:27017"

  redis:
    ports:
      - "6379:6379"

  # Hot-reload para backend-negocio
  backend-negocio:
    build:
      context: ./backend-negocio
      dockerfile: Dockerfile
      target: builder
    command: npm run start:dev
    volumes:
      - ./backend-negocio:/app
      - /app/node_modules
    ports:
      - "${NEGOCIO_PORT:-3001}:3001"
      - "9229:9229"

  # Hot-reload para backend-iot
  backend-iot:
    build:
      context: ./backend-iot
      dockerfile: Dockerfile
      target: builder
    command: npm run start:dev
    volumes:
      - ./backend-iot:/app
      - /app/node_modules
    ports:
      - "${IOT_PORT:-3002}:3002"
      - "9230:9229"

  # Vite dev server con HMR. Build target=dev cachea las deps en la imagen
  # (mucho mas rapido en arranques sucesivos que reinstalar en runtime).
  # Proxy interno apunta al servicio nginx por DNS dentro de sgt-network.
  # CHOKIDAR_USEPOLLING evita que HMR se cuelgue en bind-mounts de Windows.
  # Para correr en host (sin Docker) usa: cd frontend-web && npm run dev
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: dev
    command: npm run dev
    environment:
      VITE_PROXY_TARGET: http://nginx
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules
    # !override reemplaza la lista de ports del compose base (5173:80, modo
    # prod) por la de dev. Sin esto, Compose concatena ambas listas y el
    # contenedor intenta bindear 5173 dos veces -> "port is already allocated".
    ports: !override
      - "${WEB_PORT:-5173}:5173"

volumes:
  frontend_node_modules:
